services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamebackend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gamebackend"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: GameBackend.api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=gamebackend;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Jwt__Issuer: GameBackend
      Jwt__Audience: GameBackend.Clients
      Jwt__Secret: ${JWT_SECRET:-local-docker-secret-change-me-at-least-32-chars}
      Database__MigrateOnStartup: "true"
    ports:
      - "5165:8080"

volumes:
  pgdata:
